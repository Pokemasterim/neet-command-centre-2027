name: Build & Release NEET Command Centre APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.7)'
        required: true
        default: 'v2.7'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Determine Release Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v2.7"
          fi
          VER_NAME="${TAG#v}"
          echo "value=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Restore fixed Android signing keystore into android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing in GitHub Settings -> Secrets -> Actions!"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/fixed-signing.keystore
          chmod 600 android/app/fixed-signing.keystore
          echo "Restored fixed signing keystore:"
          keytool -list -keystore android/app/fixed-signing.keystore -storepass android -alias androiddebugkey | grep -E "Alias name|Creation date|SHA-256" || true

      - name: Generate Android app icon from assets/icon.png
        run: |
          if [ -f "assets/icon.png" ]; then
            npx --yes @capacitor/assets generate --android
          fi

      - name: Configure explicit fixed signingConfig & bump versionCode/versionName
        env:
          RUN_NUM: ${{ github.run_number }}
          VER_NAME: ${{ steps.tag.outputs.version_name }}
        run: |
          python3 -c '
          import os, pathlib, re
          bf = pathlib.Path("android/app/build.gradle")
          txt = bf.read_text(encoding="utf-8")

          # 1. Auto-increment versionCode and set versionName
          vcode = 100 + int(os.environ.get("RUN_NUM", "1"))
          vname = os.environ.get("VER_NAME", "2.7")
          txt = re.sub(r"versionCode\s+\d+", f"versionCode {vcode}", txt, count=1)
          txt = re.sub(r"versionName\s+\"[^\"]+\"", f"versionName \"{vname}\"", txt, count=1)

          # 2. Explicitly wire fixed-signing.keystore into signingConfigs + debug buildType
          if "fixed-signing.keystore" not in txt:
              signing_block = """
              signingConfigs {
                  fixedSign {
                      storeFile file("fixed-signing.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              """
              if "buildTypes {" in txt:
                  txt = txt.replace("buildTypes {", signing_block + "\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.fixedSign\n        }", 1)
              else:
                  raise SystemExit("ERROR: Could not find buildTypes block in android/app/build.gradle")

          bf.write_text(txt, encoding="utf-8")
          print(f"Configured explicit fixed signingConfig + versionCode={vcode}, versionName={vname}")
          '

      - name: Add Android Notification & Exact Alarm permissions
        run: |
          python3 -c '
          import pathlib
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = mf.read_text(encoding="utf-8")
          perms = [
            "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
            "<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />",
            "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
            "<uses-permission android:name=\"android.permission.VIBRATE\" />"
          ]
          for p in perms:
              if p not in txt:
                  txt = txt.replace("<application", "    " + p + "\n    <application", 1)
          mf.write_text(txt, encoding="utf-8")
          print("Updated AndroidManifest.xml with native alarm permissions.")
          '

      - name: Build Android APK & Verify Signing Certificate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../NEET-Command-Centre-2027.apk
          echo "=== VERIFYING APK SIGNING CERTIFICATE ==="
          CERT_OUT=$(keytool -printcert -jarfile ../NEET-Command-Centre-2027.apk)
          echo "$CERT_OUT" | grep -E "Owner:|Issuer:|Valid from:|SHA256:" || true
          if echo "$CERT_OUT" | grep -q "CN=Android Debug"; then
            echo "ERROR: APK was signed with an ephemeral Android Debug key instead of your fixed keystore!"
            exit 1
          fi
          echo "VERIFIED: APK is signed with your permanent fixed keystore!"

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEET-Command-Centre-2027-APK
          path: NEET-Command-Centre-2027.apk

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: NEET Command Centre 2027 (${{ steps.tag.outputs.value }})
          body: |
            Automated Android APK build for **NEET Command Centre 2027 (${{ steps.tag.outputs.value }})** with fixed signing key and native local notifications.

            **Permanent Latest Download URL:**
            `https://github.com/${{ github.repository }}/releases/latest/download/NEET-Command-Centre-2027.apk`
          files: NEET-Command-Centre-2027.apk
          make_latest: true
