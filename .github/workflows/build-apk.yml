name: Build & Release NEET Command Centre APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.4.2)'
        required: true
        default: 'v2.4.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Determine Release Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v2.4.2"
          fi
          VER_NAME="${TAG#v}"
          echo "value=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT

      - name: Restore fixed Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing in GitHub Settings -> Secrets -> Actions!"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Restored fixed debug.keystore:"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "Alias name|Creation date|SHA-256" || true

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android app icon from assets/icon.png
        run: |
          if [ -f "assets/icon.png" ]; then
            npx --yes @capacitor/assets generate --android
          fi

      - name: Bump Android versionCode & versionName
        env:
          RUN_NUM: ${{ github.run_number }}
          VER_NAME: ${{ steps.tag.outputs.version_name }}
        run: |
          python3 -c '
          import os, pathlib, re
          bf = pathlib.Path("android/app/build.gradle")
          txt = bf.read_text(encoding="utf-8")
          vcode = 100 + int(os.environ.get("RUN_NUM", "1"))
          vname = os.environ.get("VER_NAME", "2.4.2")
          txt = re.sub(r"versionCode\s+\d+", f"versionCode {vcode}", txt, count=1)
          txt = re.sub(r"versionName\s+\"[^\"]+\"", f"versionName \"{vname}\"", txt, count=1)
          bf.write_text(txt, encoding="utf-8")
          print(f"Set Android versionCode={vcode}, versionName={vname}")
          '

      - name: Add Android Notification & Exact Alarm permissions
        run: |
          python3 -c '
          import pathlib
          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = mf.read_text(encoding="utf-8")
          perms = [
            "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
            "<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />",
            "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
            "<uses-permission android:name=\"android.permission.VIBRATE\" />"
          ]
          for p in perms:
              if p not in txt:
                  txt = txt.replace("<application", "    " + p + "\n    <application", 1)
          mf.write_text(txt, encoding="utf-8")
          print("Updated AndroidManifest.xml with native alarm permissions.")
          '

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../NEET-Command-Centre-2027.apk

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEET-Command-Centre-2027-APK
          path: NEET-Command-Centre-2027.apk

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: NEET Command Centre 2027 (${{ steps.tag.outputs.value }})
          body: |
            Automated Android APK build for **NEET Command Centre 2027 (${{ steps.tag.outputs.value }})** with Capacitor native local notifications.

            **Permanent Latest Download URL:**
            `https://github.com/${{ github.repository }}/releases/latest/download/NEET-Command-Centre-2027.apk`
          files: NEET-Command-Centre-2027.apk
          make_latest: true

